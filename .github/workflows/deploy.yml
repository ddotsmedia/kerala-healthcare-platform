name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "9"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Web Image
        run: |
          docker build \
            -f apps/web/Dockerfile \
            -t malayalimed-web:${{ github.sha }} \
            -t malayalimed-web:latest \
            .

      - name: Push to Registry
        run: |
          echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker tag malayalimed-web:${{ github.sha }} ghcr.io/${{ github.repository }}/malayalimed-web:${{ github.sha }}
          docker tag malayalimed-web:latest ghcr.io/${{ github.repository }}/malayalimed-web:latest
          docker push ghcr.io/${{ github.repository }}/malayalimed-web:${{ github.sha }}
          docker push ghcr.io/${{ github.repository }}/malayalimed-web:latest

      - name: Save Current Image Tag
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/kerala-healthcare-platform
            CURRENT_IMAGE=$(docker compose -f infra/docker/docker-compose.prod.yml images mm-web | tail -1 | awk '{print $3}')
            echo "$CURRENT_IMAGE" > /tmp/previous_image_tag
            cat /tmp/previous_image_tag

      - name: Deploy Web Service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/kerala-healthcare-platform
            git pull origin main
            docker compose -f infra/docker/docker-compose.prod.yml pull mm-web
            docker compose -f infra/docker/docker-compose.prod.yml up -d --no-deps mm-web

      - name: Run Migrations
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/kerala-healthcare-platform
            docker compose -f infra/docker/docker-compose.prod.yml exec -T mm-web pnpm db:migrate

      - name: Health Check
        id: health_check
        run: |
          for attempt in {1..5}; do
            response=$(curl -s -w "\n%{http_code}" https://malayalimed.com/en)
            status=$(echo "$response" | tail -n1)
            body=$(echo "$response" | head -n-1)

            if [ "$status" = "200" ] && echo "$body" | grep -q "MalayaliMed"; then
              echo "✓ Health check passed"
              exit 0
            fi

            echo "Attempt $attempt/5: Status $status"
            sleep 15
          done

          echo "✗ Health check failed"
          exit 1

      - name: Rollback on Failure
        if: failure() && steps.health_check.outcome == 'failure'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/kerala-healthcare-platform
            PREVIOUS_IMAGE=$(cat /tmp/previous_image_tag)
            echo "Rolling back to $PREVIOUS_IMAGE"
            docker compose -f infra/docker/docker-compose.prod.yml pull
            docker tag "$PREVIOUS_IMAGE" mm-web:rollback
            docker compose -f infra/docker/docker-compose.prod.yml up -d --no-deps mm-web

            # Re-verify
            sleep 10
            response=$(curl -s -w "\n%{http_code}" https://malayalimed.com/en)
            status=$(echo "$response" | tail -n1)
            if [ "$status" = "200" ]; then
              echo "✓ Rollback successful"
              exit 0
            else
              echo "✗ Rollback failed — manual intervention required"
              exit 1
            fi
