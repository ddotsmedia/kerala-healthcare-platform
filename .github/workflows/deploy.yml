name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "9"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Web Image
        run: |
          docker build \
            -f infra/docker/Dockerfile.web \
            -t khp-web:${{ github.sha }} \
            -t khp-web:latest \
            .

      - name: Push to Registry
        run: |
          echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker tag khp-web:${{ github.sha }} ghcr.io/${{ github.repository }}/khp-web:${{ github.sha }}
          docker tag khp-web:latest ghcr.io/${{ github.repository }}/khp-web:latest
          docker push ghcr.io/${{ github.repository }}/khp-web:${{ github.sha }}
          docker push ghcr.io/${{ github.repository }}/khp-web:latest

      - name: Save Current Image Tag
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/kerala-healthcare-platform
            CURRENT_IMAGE=$(docker inspect -f '{{.Config.Image}}' $(docker compose -f infra/docker/docker-compose.prod.yml ps -q khp-web))
            echo "$CURRENT_IMAGE" > /opt/kerala-healthcare-platform/.last-khp-web-image
            cat /opt/kerala-healthcare-platform/.last-khp-web-image

      - name: Deploy Web Service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          env:
            KHP_WEB_IMAGE: ghcr.io/${{ github.repository }}/khp-web:${{ github.sha }}
            GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          script: |
            cd /opt/kerala-healthcare-platform
            echo "$GHCR_TOKEN" | docker login ghcr.io -u $GITHUB_ACTOR --password-stdin
            git pull origin main
            docker compose -f infra/docker/docker-compose.prod.yml pull khp-web
            docker compose -f infra/docker/docker-compose.prod.yml up -d --no-deps khp-web

      - name: Run Migrations
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/kerala-healthcare-platform
            docker compose -f infra/docker/docker-compose.prod.yml exec -T khp-web pnpm db:migrate

      - name: Health Check
        id: health_check
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/kerala-healthcare-platform
            for attempt in {1..5}; do
              if docker compose -f infra/docker/docker-compose.prod.yml exec -T khp-web curl -s http://localhost:3000/api/health | grep -q '"status":"ok"'; then
                echo "✓ Health check passed"
                exit 0
              fi
              echo "Attempt $attempt/5: Health check failed"
              sleep 10
            done
            echo "✗ Health check failed after 5 attempts"
            exit 1

      - name: Rollback on Failure
        if: failure() && steps.health_check.outcome == 'failure'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          env:
            KHP_WEB_IMAGE: ''
          script: |
            cd /opt/kerala-healthcare-platform
            PREVIOUS_IMAGE=$(cat /opt/kerala-healthcare-platform/.last-khp-web-image)
            echo "Rolling back to $PREVIOUS_IMAGE"
            export KHP_WEB_IMAGE="$PREVIOUS_IMAGE"
            docker compose -f infra/docker/docker-compose.prod.yml up -d --no-deps khp-web

            # Re-verify
            sleep 10
            if docker compose -f infra/docker/docker-compose.prod.yml exec -T khp-web curl -s http://localhost:3000/api/health | grep -q '"status":"ok"'; then
              echo "✓ Rollback successful"
              exit 0
            else
              echo "✗ Rollback failed — manual intervention required"
              exit 1
            fi
